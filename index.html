<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triathlon</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Triathlon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: iPhone-App mit Tab-Pille unten; ab 960 px Seitenleiste links und zweispaltige Heute-Ansicht */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E5E5EA; --fill-2:#F2F2F7; --fg:#1C1C1E; --fg-2:#3A3A3C; --muted:#6E6E73; --faint:#8E8E93; --line:#E5E5EA; --chev:#C7C7CC;
  --ink:#1C1C1E; --on-ink:#FFFFFF;
  --bike:#D9824F; --bike-t:#F7E9DF; --bike-d:#8A4A23; --bike-l:#EBC6AC; --bike-tr:#F1E2D6; --bike-hl:#A85A2C; --bike-sep:#E2C7B4; --bike-mu:#6B4A36;
  --run:#5FA27E; --run-t:#E3F0E8; --run-d:#3F7A5A; --run-l:#B9D9C6; --run-tr:#DCEDE3; --run-hl:#2E6B4B; --run-sep:#BFD8C8; --run-mu:#4A6655;
  --swim:#4F86B8; --swim-t:#E1ECF6; --swim-d:#2F5F8A; --swim-l:#B8D0E6; --swim-tr:#DCE7F2; --swim-hl:#2F5F8A; --swim-sep:#C3D6EA; --swim-mu:#4A5F73;
  --kraft:#8C7BC2; --kraft-t:#ECE8F6; --kraft-d:#5E4E99; --kraft-l:#CFC6EA; --kraft-tr:#ECE8F6; --kraft-hl:#5E4E99; --kraft-sep:#D6CFEE; --kraft-mu:#5B5470;
  --mob:#4BA3A3; --mob-t:#E0F0F0; --mob-d:#2F7474; --mob-l:#B5DADA; --mob-tr:#E0F0F0; --mob-hl:#2F7474; --mob-sep:#C2DEDE; --mob-mu:#4A6262;
  --ok:#248A3D; --warn:#B7791F; --warn-t:#FBEFD9; --bad:#C0392B; --bad-t:#F9E1DE;
  --nav-bg:rgba(255,255,255,.88); --shadow:0 8px 24px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1C1C1E; --fill:#3A3A3C; --fill-2:#2C2C2E; --fg:#F2F2F7; --fg-2:#D1D1D6; --muted:#98989F; --faint:#8E8E93; --line:#38383A; --chev:#48484A;
  --ink:#F2F2F7; --on-ink:#1C1C1E;
  --bike:#E0915F; --bike-t:#33241A; --bike-d:#F0B48C; --bike-l:#6E4630; --bike-tr:#3E2B1F; --bike-hl:#F2A877; --bike-sep:#5A4030; --bike-mu:#D9B9A3;
  --run:#6DB58D; --run-t:#1C3126; --run-d:#8FD1AC; --run-l:#2F5A43; --run-tr:#1F3528; --run-hl:#A6E0BF; --run-sep:#355745; --run-mu:#B5D3C2;
  --swim:#6A9FCF; --swim-t:#182838; --swim-d:#9CC4E8; --swim-l:#2C4B68; --swim-tr:#1C2B3A; --swim-hl:#B5D4F0; --swim-sep:#33506B; --swim-mu:#B3C6D8;
  --kraft:#A797DB; --kraft-t:#241F36; --kraft-d:#C9BDF2; --kraft-l:#463B6E; --kraft-tr:#2A2440; --kraft-hl:#D6CCF7; --kraft-sep:#4A4170; --kraft-mu:#C6BEDF;
  --mob:#5EBDBD; --mob-t:#152E2E; --mob-d:#8FDCD9; --mob-l:#2A5555; --mob-tr:#163434; --mob-hl:#A8E8E5; --mob-sep:#2E5656; --mob-mu:#B1D6D6;
  --ok:#30D158; --warn:#F0B44C; --warn-t:#3A2C12; --bad:#F2766A; --bad-t:#3D1C19;
  --nav-bg:rgba(44,44,46,.9); --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* Fester, deckender Streifen hinter der Statusleiste: iOS blendet oben dann hart statt weich verschwommen */
.statusbg{position:fixed;z-index:30;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);pointer-events:none}
/* Weicher Auslauf erst beim Scrollen – ganz oben bleibt das Datum klar und dicht unter der Statusleiste */
.statusbg::after{content:'';position:absolute;left:0;right:0;top:100%;height:22px;background:linear-gradient(to bottom,var(--bg),transparent);opacity:0;transition:opacity 200ms ease-out}
html.scrolled .statusbg::after{opacity:1}
/* Fläche hinter der Tab-Pille: Inhalte laufen weich aus, statt unter der Leiste sichtbar zu bleiben */
.navbg{position:fixed;z-index:14;left:0;right:0;bottom:0;height:calc(104px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) calc(100% - 34px),transparent);pointer-events:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
.num,.r{font-family:var(--round);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{padding:max(20px,calc(8px + env(safe-area-inset-top,0px))) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 4px}
.head .date{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.head h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.head .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-bottom:6px}
.tiny{font-size:12px;color:var(--faint)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border-radius:24px}
.banner{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
.banner b{font-size:15px}
.banner span{font-size:14px;color:var(--fg-2)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--ink);color:var(--on-ink);min-height:48px}
.btn.ghost{background:var(--fill-2);color:var(--fg)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:6px 0;font-weight:600;font-size:14px;color:var(--c-d,var(--fg));min-height:36px}

/* Einheit aufgeklappt */
.unit{background:var(--c-t);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.u-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.u-sport{display:flex;align-items:center;gap:8px;min-width:0}
.dot-ico,.u-sport .dot-ico{width:34px;height:34px;border-radius:50%;background:var(--c-d);color:#fff;display:grid;place-items:center;flex:none}
@media (prefers-color-scheme: dark){.dot-ico,.u-sport .dot-ico{background:var(--c);color:#1C1C1E}}
.dot-ico svg{width:20px;height:20px}
.u-sport span{font-size:14px;font-weight:600;color:var(--c-d)}
.u-dur{font-family:var(--round);font-size:15px;font-weight:700;color:var(--c-d);white-space:nowrap}
.done-pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);color:var(--c-d);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.done-pill svg{width:13px;height:13px}
.miss-pill{display:inline-flex;align-items:center;background:var(--card);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.u-title{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.u-title.long{font-size:32px}
.flow{display:flex;height:30px;align-items:flex-end;gap:2px}
.flow i{display:block;border-radius:5px;min-width:3px}
.steps{display:flex;flex-direction:column;border-top:.5px solid var(--c-sep)}
.st{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:.5px solid var(--c-sep);font-size:15px}
.st:last-child{border-bottom:0;padding-bottom:0}
.st .d{font-family:var(--round);font-weight:700}
.st .l{color:var(--c-mu);min-width:0}
.st .t{font-family:var(--round);font-weight:600;text-align:right}
.st.main .l{color:var(--fg);font-weight:600}
.st.main .t,.st.main .d.hl{font-weight:800;color:var(--c-hl)}
.rep{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-bottom:.5px solid var(--c-sep)}
.rep:last-child{border-bottom:0}
.rep-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.rep-h b{background:var(--c-hl);color:var(--card);border-radius:6px;padding:1px 7px;font-size:12px}
.rep .st{padding:3px 0 3px 12px;border-bottom:0;border-left:2px solid var(--c-l)}
.rep .st.main{border-left-color:var(--c)}
.note{font-size:14px;color:var(--c-mu)}
.act-h{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mu)}
.act-h::after{content:'';flex:1;height:1px;background:var(--c-sep)}
.actual{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.actual div{display:flex;flex-direction:column}
.actual b{font-family:var(--round);font-size:20px;font-weight:700;white-space:nowrap}
.actual small{font-size:11px;color:var(--muted)}

/* Einheit zugeklappt */
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:24px;padding:12px 16px;min-height:60px}
.tile .ic{width:34px;height:34px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;flex:none}
.tile .ic svg{width:20px;height:20px}
.tile .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.tile .tx b{font-size:15px;font-weight:600}
.tile .tx small{font-size:12px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--chev);flex:none}
.ubody{display:flex;flex-direction:column;gap:12px}
.tile .done-pill{background:var(--c-t)}

/* Bereit / Ergebnis */
.status-h{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.st-ic{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--fg);display:grid;place-items:center;flex:none}
.st-ic svg{width:15px;height:15px}
.st-ic.y{background:var(--warn-t);color:var(--warn)}
.st-ic.r{background:var(--bad-t);color:var(--bad)}
.status-h .tx{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.status-h .tx b{font-size:16px;font-weight:600}
.status-h .tx small{font-size:13px;color:var(--fg-2)}
.status-h .right{font-size:14px;color:var(--muted);white-space:nowrap}
.kpi4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 8px 14px}
.kpi4 div{display:flex;flex-direction:column;align-items:center}
.kpi4 b{font-family:var(--round);font-size:19px;font-weight:700}
.kpi4 small,.kpi4 span{font-size:11px;color:var(--muted)}
.advice{margin:0 16px 14px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--warn-t)}
.advice.r{background:var(--bad-t)}
.hint{padding:0 16px 12px;font-size:12px;color:var(--faint)}
/* Tagesform und Kurz-Check: eine dezente Kachel, Ampel nur als Punkt */
.stcard{padding:14px 18px 12px;display:flex;flex-direction:column;gap:8px}
.st-h{display:flex;align-items:center;gap:10px}
.st-h b{font-size:15px;font-weight:600}
.st-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--faint)}
.st-dot.g{background:var(--ok)}.st-dot.y{background:var(--warn)}.st-dot.r{background:var(--bad)}
.st-fl{font-size:13px;color:var(--fg-2)}
.st-k{display:flex;flex-wrap:nowrap;gap:16px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.st-form{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.st-form b{font-family:var(--round);font-weight:600;color:var(--fg)}
.st-k b{font-family:var(--round);font-weight:600;color:var(--fg)}
.stcard .advice{margin:2px 0 0;padding:8px 10px;font-size:13px}
.stcard .hint{padding:0;font-size:11.5px}
.check.in{border-top:.5px solid var(--line);margin:4px 0 0;padding:12px 0 2px;gap:8px}
.ck-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.ck-h .link{min-height:32px;padding:0;font-size:14px}
.check.in .eyebrow{font-size:11.5px}
.check.in .cbt button{height:40px;font-size:16px}
.crow .lab small{display:block;font-size:11px;font-weight:400;color:var(--faint)}
.feel.in{border-top:.5px solid var(--line);margin:4px 0 -4px;padding:4px 0 0;flex-wrap:nowrap}
.feel .ft{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feel .ft b{color:var(--fg);font-weight:600;font-family:var(--round)}
.feel .fl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.feel .link{flex:none;font-size:13px;min-height:32px}

/* Kurz-Check */
.check{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.check .eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
.crow{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:2px 10px;align-items:center}
.crow .lab{font-weight:600;font-size:15px}
.cbt{display:flex;gap:6px}
.cbt button{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--fill-2);font-family:var(--round);font-size:17px;font-weight:700}
.cbt button[aria-checked="true"]{background:var(--ink);color:var(--on-ink)}
.feel{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 6px}

/* Woche */
.week{padding:14px 16px;display:flex;align-items:center;gap:14px}
.week svg.rings{flex:none}
.week .tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex-grow:1}
.week .tx small{font-size:12px;font-weight:600;color:var(--muted)}
.week .tx b{font-family:var(--round);font-size:20px;font-weight:700;line-height:1.15}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));max-width:640px;gap:4px 12px;font-size:13px;color:var(--muted);padding-top:2px}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 16px 14px}
.daystrip .dsd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;border-radius:12px;border:0;background:none;min-height:44px}
.daystrip .dsd.today{background:var(--fill-2)}
button.dsd:active{background:var(--fill)}
.daystrip small{font-size:11px;color:var(--muted)}
.daystrip .today small{color:var(--fg);font-weight:700}
.daystrip .dots{display:flex;gap:3px;min-height:9px}
.daystrip .dots i{width:8px;height:8px;border-radius:50%}
.daystrip .dots i.o{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--cc)}

.sec-label{font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px 0;text-transform:uppercase;letter-spacing:.03em}

/* Woche-Ansicht */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center}
.wnav button svg{width:18px;height:18px}
.wnav div{text-align:center}
.wnav b{display:block;font-size:20px}
.wnav small{font-size:13px;color:var(--muted)}
.day{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.day-h b{font-size:15px}
.shift{font-size:12px;font-weight:600;color:var(--muted);background:var(--fill-2);border-radius:6px;padding:2px 8px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 0;min-height:44px}
.row .ic{width:30px;height:30px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;flex:none}
.row .ic svg{width:17px;height:17px}
.row .tx{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.row .tx b{font-size:15px;font-weight:600}
.row .tx small{font-size:12px;color:var(--muted)}
.row .r{font-size:13px;color:var(--muted);white-space:nowrap}
.row .ok{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.row .ok svg{width:12px;height:12px}
.free{font-size:14px;color:var(--faint);padding:4px 0}

/* Fortschritt */
.pcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pcard .eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big3 div{display:flex;flex-direction:column}
.big3 b{font-family:var(--round);font-size:30px;font-weight:800;line-height:1.05}
.big3 small{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.clegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.clegend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sprow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.sprow .ic{width:34px;height:34px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center}
.sprow .ic svg{width:19px;height:19px}
.sprow small{display:block;font-size:12px;color:var(--muted)}
.spv{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.spv b{font-size:17px}
.spv small{font-size:12px}

/* Übersicht vor dem Start */
.u-sum{margin:0;font-size:15px;line-height:1.45;color:var(--c-mu)}
.ov{background:var(--card);border-radius:24px;overflow:hidden}
.ov-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:.5px solid var(--line);padding:12px 16px;min-height:56px;color:var(--fg)}
.ov-row:last-child{border-bottom:0}
.ov-row .tx{display:flex;flex-direction:column;min-width:0;flex-grow:1}
.ov-row .tx b{font-size:15px;font-weight:600}
.ov-row .tx small{font-size:13px;color:var(--muted)}
.ov-row.done .tx b{color:var(--faint)}
.ov-n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;font-family:var(--round);font-weight:700;font-size:14px}
.ov-n.on{background:var(--c);color:#fff}
.ov-n svg{width:14px;height:14px}
.run-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.run-top .link{display:inline-flex;align-items:center;gap:2px;padding-left:0}
.run-top .link .chev{width:18px;height:18px}
.run-top small{font-size:13px;color:var(--muted)}
.ov-row:active{background-color:var(--fill-2)}

/* Kraft */
.ex-card{background:var(--card);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ex-head small{font-size:12px;font-weight:600;color:var(--c-d)}
.ex-head b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ex-head span{font-size:13px;color:var(--muted)}
.fig{background:var(--c-t);border-radius:18px;padding:8px 14px 4px}
.fig svg{width:100%;height:auto;display:block;max-height:200px;margin:0 auto}
.howto{font-size:15px;line-height:1.45;margin:0}
.cue{font-size:14px;color:var(--c-d);margin:0}
.sugg{background:var(--c-t);border-radius:12px;padding:9px 12px;font-size:14px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) 78px 44px;gap:8px;align-items:center;border-radius:14px;padding:6px}
.set.head{padding:0 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.set.head span:nth-child(3){text-align:center}
.set.cur{box-shadow:inset 0 0 0 1.5px var(--c)}
.set.ok{background:var(--c-t)}
.set .n{font-family:var(--round);font-weight:700;font-size:17px;text-align:center}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:10px;border:0;background:var(--fill-2);font-size:20px;line-height:1}
.stp b{font-family:var(--round);font-size:20px;min-width:30px;text-align:center}
.set input{width:100%;height:40px;border-radius:10px;border:0;background:var(--fill-2);color:var(--fg);text-align:center;font-family:var(--round);font-weight:700;font-size:17px;padding:0 4px}
.set .dash{text-align:center;color:var(--faint)}
.tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--chev);background:var(--card);color:var(--chev);display:grid;place-items:center}
.tick svg{width:20px;height:20px}
.set.ok .tick{background:var(--c);border-color:var(--c);color:#fff}
.set-acts{display:flex;gap:18px;flex-wrap:wrap}
.exlist{background:var(--card);border-radius:24px;overflow:hidden}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:.5px solid var(--line);padding:10px 16px;min-height:64px}
.exrow:last-child{border-bottom:0}
.thumb{width:58px;flex:none;background:var(--fill-2);border-radius:10px;padding:3px}
.thumb svg{width:100%;height:auto;display:block}
.exrow .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.exrow .tx b{font-size:15px;font-weight:600}
.exrow .tx small{font-size:12px;color:var(--muted)}
.exrow .tx span{font-size:13px;color:var(--fg-2);padding-top:2px}
.exrow .pill{font-family:var(--round);font-size:12px;font-weight:700;color:var(--c-d);background:var(--c-t);border-radius:999px;padding:3px 8px;white-space:nowrap}
.exrow.done .tx b{color:var(--faint);text-decoration:line-through}

/* Mobility */
.mob-ex{border-bottom:.5px solid var(--line)}
.mob-ex:last-child{border-bottom:0}
.mob-row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px}
.mob-row .open{display:flex;align-items:center;gap:12px;flex-grow:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.mob-row .tx{display:flex;flex-direction:column;min-width:0}
.mob-row .tx b{font-size:15px;font-weight:600}
.mob-row .tx small{font-size:12px;color:var(--muted)}
.mob-ex.done .tx b{color:var(--faint);text-decoration:line-through}
.mob-ex.done .thumb{opacity:.55}
.mcheck{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--chev);background:var(--card);flex:none;display:grid;place-items:center;color:#fff}
.mcheck svg{width:16px;height:16px}
.mcheck[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.mob-detail{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--fill-2)}
.mob-ex.active .mob-row{background:var(--fill-2)}
.timer{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:12px 14px}
.timer .tx{display:flex;flex-direction:column;gap:8px;flex-grow:1;min-width:0}
.timer small{font-size:13px;color:var(--muted);line-height:1.35}
.timer small .now{font-size:16px;color:var(--fg)}
.seq{font-size:14px;line-height:1.4;margin:0;color:var(--muted)}
.seq b{color:var(--fg)}
.timer .bts{display:flex;gap:8px}
.timer .bts button{flex:1;height:42px;border-radius:999px;border:0;background:var(--fill-2);font-weight:600;font-size:14px}
.timer .bts button.go{background:var(--c-d);color:var(--card)}

.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.restbar b{font-family:var(--round);font-size:17px}
.restbar button{border:0;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--on-ink);color:var(--ink)}
.msg{font-size:14px;color:var(--bad)}

/* Navigation */
nav.tabs{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:flex;gap:4px;background:var(--nav-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
nav.tabs a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--muted);border-radius:999px;font-size:14px;font-weight:600;padding:11px 0;min-height:44px}
nav.tabs a svg{width:18px;height:18px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.side-nav{display:none}

/* Detail-Blatt */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top small{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase}
.sheet-top button{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}

/* Einrichtung */
.setup{display:flex;flex-direction:column;gap:14px;padding-top:30px}
.setup h1{font-size:34px;margin:0}
.setup label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.setup input{height:48px;border-radius:12px;border:0;background:var(--card);color:var(--fg);padding:0 14px;font-size:16px;font-weight:400}
.setup p{margin:0;color:var(--fg-2);font-size:15px}

.skel{height:220px;border-radius:28px;background:var(--card);opacity:.6}


/* Bewegung und Feedback: gemeinsame Tokens, Ankommen bremst ab, Gehen beschleunigt */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.4,0,1,1);--t-fast:120ms;--t-med:240ms;--t-slow:420ms}
button,a,.tile,.row,.exrow,.ov-row{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,.tile,.row,.exrow,nav a{transition:transform var(--t-fast) var(--ease-out),background-color var(--t-med) var(--ease-out),color var(--t-med) var(--ease-out),opacity var(--t-fast) linear}
button:not([disabled]):active,.tile:active,.row:active,.exrow:active,nav a:active{transform:scale(.97)}
.tile:active,.exrow:active,.row:active{background-color:var(--fill-2)}
.btn:not([disabled]):active{opacity:.85}
.set{transition:background-color var(--t-med) var(--ease-out),box-shadow var(--t-med) var(--ease-out)}
.set.ok .tick svg,.mcheck[aria-pressed="true"] svg,.done-pill svg{animation:pop var(--t-med) var(--ease-out)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pfill{transition:width var(--t-slow) var(--ease-out)}
svg.rings circle{transition:stroke-dasharray var(--t-slow) var(--ease-out)}
.cbt button[aria-checked="true"]{animation:pop var(--t-med) var(--ease-out)}
.uwrap{display:flex;flex-direction:column;gap:12px}
button.u-top{width:100%;border:0;background:none;padding:0;margin:-4px 0;min-height:44px;text-align:left;color:inherit;font:inherit}
button.u-top:active{transform:none;opacity:.7}
.u-right{display:flex;align-items:center;gap:8px}
.u-top .chev{transform:rotate(180deg);color:var(--c-d);opacity:.7}
.day .uwrap{margin:6px 0 8px}
.day .unit{border-radius:20px;padding:14px}
#app{touch-action:pan-y}
.slide-l{animation:slin-l 240ms var(--ease-out) both}
.slide-r{animation:slin-r 240ms var(--ease-out) both}
@keyframes slin-l{from{opacity:0;transform:translateX(20px)}}
@keyframes slin-r{from{opacity:0;transform:translateX(-20px)}}
.view-in{animation:fade 260ms var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.sheet-bg{animation:fade var(--t-med) var(--ease-out) both}
.sheet{animation:up var(--t-slow) var(--ease-out) both;will-change:transform;overscroll-behavior:contain}
.sheet-bg.closing{animation:fadeout 200ms var(--ease-in) both}
.sheet-bg.closing .sheet{animation:down 220ms var(--ease-in) both}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 2px;flex:none}
.toast{position:fixed;z-index:40;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;box-shadow:var(--shadow);animation:toastin var(--t-med) var(--ease-out) both;white-space:nowrap}
.toast svg{width:16px;height:16px}
.toast.out{animation:toastout 200ms var(--ease-in) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-12px)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,-12px)}}
nav.tabs{isolation:isolate}
nav.tabs .tab-ind{position:absolute;z-index:-1;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--ink);transition:transform var(--t-med) var(--ease-out),width var(--t-med) var(--ease-out)}
nav.tabs a[aria-current="page"]{background:transparent}
.ex-card{scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}

@media (min-width:960px){
  .app{max-width:none;margin:0 0 0 240px;padding:32px max(40px,calc((100vw - 240px - 1680px) / 2)) 40px;gap:16px}
  nav.tabs,.navbg{display:none}
  .side-nav{display:flex;position:fixed;top:0;bottom:0;left:0;width:240px;flex-direction:column;gap:4px;padding:calc(28px + env(safe-area-inset-top,0px)) 14px 24px;background:var(--fill-2);border-right:.5px solid var(--line)}
  .side-nav .brand{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:0 12px 14px}
  .side-nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg-2);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
  .side-nav a svg{width:18px;height:18px}
  .side-nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
  .side-nav .grow{flex-grow:1}
  .grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .grid2{gap:24px}
  .setup{max-width:640px}
}
@media (min-width:1360px){
  .grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
}


/* ---------- Heute: Rückblick, wenn alles erledigt ist ---------- */
.sum{padding:18px;display:flex;flex-direction:column;gap:14px}
.sum-h{display:flex;align-items:center;gap:14px}
.sum-ic{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none;animation:pop .5s var(--ease-out) both}
.sum-ic svg{width:26px;height:26px}
.sum-h .tx{display:flex;flex-direction:column;gap:2px}
.sum-h b{font-family:var(--round);font-size:24px;font-weight:800;line-height:1.1}
.sum-h small{font-size:14px;color:var(--muted)}
.sum-list{display:flex;flex-direction:column;gap:8px}
.sum-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--c-l);border-radius:16px;padding:12px 14px;min-height:56px}
.sum-row .ic,.sum-next .ic{width:36px;height:36px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;flex:none}
.sum-row .ic svg,.sum-next .ic svg{width:19px;height:19px}
.sum-row .tx,.sum-next .tx{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sum-row b{font-size:16px;font-weight:700}
.sum-row small{font-size:13px;color:var(--fg-2)}
.sum-row .ok{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.sum-row .ok svg{width:13px;height:13px}
.sum-row.done-tile{border-radius:22px;padding:14px 16px;min-height:72px}
.sum-week{display:flex;flex-direction:column;gap:8px}
.sum-wl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum-wl b{font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.sum-bar{height:8px;border-radius:99px;background:var(--fill-2);overflow:hidden}
.sum-bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.sum-next{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--c-t)}
.sum-next small{font-size:12px;font-weight:600;color:var(--muted)}
.sum-next b{font-size:16px;font-weight:700}
.sum-next .r{font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- Fortschritt ---------- */
.pgrid{display:flex;flex-direction:column;gap:12px}
.pcol{display:contents}
.pk>section{order:5}
.row small.mt{display:none}
.shift.none{display:none}
.spbar{grid-column:2/4;position:relative;display:block;height:6px;border-radius:99px;background:var(--fill-2);margin-top:2px}
.spbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c)}
.spbar em{position:absolute;top:9px;left:0;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.spbar em b{color:var(--fg);font-weight:600}
.sprow:has(.spbar){padding-bottom:18px}
.kempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;flex:1;font-size:14px;line-height:1.45;color:var(--muted);padding:12px 8px}
.kempty .ic{width:56px;height:56px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center}
.kempty .ic svg{width:28px;height:28px}
.ndays{padding:18px;display:flex;flex-direction:column;gap:12px}
.ndays .eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
.mhead{display:flex;align-items:baseline;gap:8px;padding:10px 4px 0}
.mhead b{font-size:20px;font-weight:700}
.mhead small{font-size:14px;color:var(--muted)}
.mhead .shift{margin-left:auto;align-self:center}
/* Mac: morgen als großer Block unter den heutigen Einheiten */
.mwrap{display:flex;flex-direction:column;gap:12px}
.mhead.wide{padding:14px 4px 0}
.mhead.wide b{font-size:24px}
.mu{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;border:0;background:var(--c-t);border-radius:28px;padding:18px 20px;color:var(--fg)}
.mu-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu-t{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.mu-n{font-size:15px;color:var(--c-mu)}
.mu.sm{padding:12px 20px}
.mu:hover{filter:brightness(.985)}
.nd-day{display:flex;flex-direction:column;gap:6px;background:var(--fill-2);border-radius:16px;padding:12px}
.nd-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.nd-h b{font-size:15px}
.nd-h small{font-size:13px;color:var(--muted)}
.nd-h .shift{margin-left:auto;font-size:11px}
.nd-u{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--card);border-radius:12px;padding:8px 10px;min-height:48px}
.nd-u .ic{width:30px;height:30px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;flex:none}
.nd-u .ic svg{width:16px;height:16px}
.nd-u .tx{display:flex;flex-direction:column;min-width:0}
.nd-u b{font-size:14px;font-weight:600}
.nd-u small{font-size:12px;color:var(--muted)}
.nd-day .free{font-size:13px}
.day-h .ds{display:none}
.sum-row{background:color-mix(in srgb,var(--c-l) 55%,var(--card))}

@media (min-width:960px){
  /* Einheit aus der Woche als Fenster in der Mitte */
  .sheet-bg{align-items:center;padding:32px 32px 32px 272px}
  .sheet{max-width:860px;max-height:calc(100dvh - 64px);border-radius:24px;padding:16px 20px 24px;box-shadow:var(--shadow)}
  .sheet .grab{display:none}
  .sheet{animation:dlgin var(--t-med) var(--ease-out) both}
  .sheet-bg.closing .sheet{animation:dlgout 180ms var(--ease-in) both}
  /* Fortschritt: alles auf einen Blick */
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
  .pcol{display:flex;flex-direction:column;gap:16px;min-width:0}

  .pgrid .big3 b{font-size:clamp(22px,2vw,30px);white-space:nowrap}
}
@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes dlgout{to{opacity:0;transform:translateY(10px) scale(.98)}}

@media (min-width:1100px){
  /* Woche: sieben gleich große Tage, die ganze Woche ohne Scrollen */
  .app[data-view="woche"]{height:100dvh;box-sizing:border-box;padding-bottom:28px}
  .app[data-view="woche"] .wgrid{flex:1 1 0;min-height:260px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:stretch}

  .wgrid .shift{font-size:11px;white-space:normal}
  .wgrid .row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"ic mt ok" "b b b";align-items:center;gap:6px 8px;margin:0;width:100%;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--c-l) 60%,var(--card))}
  .wgrid .row + .row{margin-top:6px}
  .wgrid .row .tx{display:contents}
  .wgrid .row .ic{grid-area:ic;width:24px;height:24px}
  .wgrid .row .ic svg{width:14px;height:14px}
  .wgrid .row .tx small{display:none}
  .wgrid .row .tx small.mt{display:block;grid-area:mt;font-size:12px;font-weight:600;color:var(--c-d)}
  .wgrid .row .tx b{grid-area:b;font-size:14px;line-height:1.25;hyphens:auto;overflow-wrap:break-word}
  .wgrid .row .r{display:none}
  .wgrid .row .ok{grid-area:ok;width:20px;height:20px}
  .wgrid .row .ok svg{width:11px;height:11px}
  .wgrid .day-h .dl{display:none}
  .wgrid .day-h b{width:100%}
  .wgrid .day-h .ds{display:flex;justify-content:space-between;gap:6px;width:100%;font-size:15px}
  .wgrid .day-h .ds span{font-weight:500;color:var(--muted)}
  .wgrid .day-h .shift{min-height:20px;display:inline-flex;align-items:center}
  .wgrid .day-h .shift.none{display:inline-flex;background:none;padding-left:0;color:var(--faint);font-weight:500}
  .wgrid .free{font-size:13px;padding:4px}
}


@media (min-width:960px){
  /* Heute & Fortschritt füllen die Höhe des Fensters */
  .app[data-view="heute"],.app[data-view="fortschritt"]{min-height:100dvh;box-sizing:border-box}
  .app[data-view="heute"] .grid2{flex:1 1 auto;align-items:stretch}
  .app[data-view="heute"] .col>:last-child{flex:1 1 auto}
  .nd-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
  .app[data-view="heute"] .col>.card:last-child:has(.week){display:flex;flex-direction:column}
  .app[data-view="fortschritt"] .pgrid{flex:1 1 auto;align-items:stretch}
  .app[data-view="fortschritt"] .pcol>:last-child{flex:1 1 auto}
  .app[data-view="fortschritt"] .pgrid .chart svg{max-height:none}
  .app[data-view="fortschritt"] .sprow{padding-top:10px;padding-bottom:10px}
  .app[data-view="fortschritt"] .pcol:first-child>.pcard:last-child .sprow{flex:1 1 0}
  .app[data-view="fortschritt"] .pcol>.chart{flex:1 1 0;justify-content:center}
  .app[data-view="fortschritt"] .sprow{align-content:center}
  .app[data-view="heute"] .daystrip{flex:1 1 auto;align-items:center;padding-top:8px}
  .app[data-view="heute"] .daystrip .dsd{justify-content:center;gap:8px}
  .app[data-view="heute"] .daystrip .dots i{width:11px;height:11px}
  .app[data-view="heute"] .daystrip small{font-size:13px}
}
@media (hover:hover) and (pointer:fine){
  .nd-u:hover{background:var(--fill)}
  .wgrid .row:hover{background:color-mix(in srgb,var(--c-l) 90%,var(--card))}
}
/* ---------- Laptop: Maus, Tastatur, breite Fenster ---------- */
.skip{position:fixed;z-index:50;left:12px;top:-60px;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none}
.skip:focus-visible{top:12px}
#app:focus{outline:none}
kbd{font-family:var(--round);font-size:11px;font-weight:700;line-height:1;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;background:var(--card);color:var(--muted);box-shadow:inset 0 -1px 0 var(--line),0 0 0 .5px var(--line)}
.side-nav kbd,.side-keys,.side-count{display:none}
.chart{position:relative}
.chart svg[data-chart]{cursor:crosshair;border-radius:12px}
.chart .hit{fill:transparent}
.chart .hit.bar.on{fill:var(--fg);fill-opacity:.06}
.ctip{position:absolute;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:1px;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow)}
.ctip b{font-size:12px}
.ctip span{font-family:var(--round);font-variant-numeric:tabular-nums;opacity:.85}
.wnav .today-link{display:block;width:auto;height:auto;min-height:32px;margin:2px auto 0;padding:4px 10px;border-radius:8px;background:none;font-size:13px;white-space:nowrap;color:var(--fg)}
.ex-body{display:flex;flex-direction:column;gap:12px}
.ex-l,.ex-r,.mob-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.ex-l:empty{display:none}
.ubody{container-type:inline-size}


/* Breite Einheit: Bild und Erklärung links, Sätze bzw. Timer rechts */
@container (min-width:600px){
  .ex-body:not(.solo){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
  .ex-body .fig svg{max-height:240px}
}
@container (min-width:520px){
  .mob-detail:not(.solo){display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start;padding-top:4px}
}

@media (min-width:960px){
  .side-nav kbd{display:inline-grid;margin-left:auto;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .side-nav a[aria-current="page"] kbd{color:var(--on-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-ink) 35%,transparent)}
  .side-count{display:flex;flex-direction:column;gap:2px;margin:0 2px 12px;padding:14px;border-radius:16px;background:var(--card)}
  .side-count small{font-size:12px;font-weight:600;color:var(--muted)}
  .side-count b{font-family:var(--round);font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .side-count span{font-size:12px;color:var(--muted)}
  .side-keys{display:block;margin:0;padding:0 12px;font-size:12px;line-height:2.1;color:var(--faint)}
  .side-keys kbd{margin-right:3px}
  .head-count{display:none}
  .head h1{font-size:38px}
  .unit{padding:22px}
  .day .unit{padding:16px}
  .ex-card,.check,.pcard{padding:18px 20px}
  .mob-row{padding:10px 20px}
  .mob-detail{padding:4px 20px 18px}
  .exrow,.ov-row{padding-left:20px;padding-right:20px}
  .restbar{bottom:28px;left:calc(50% + 120px)}
  .toast{left:calc(50% + 120px);top:20px}
}

/* Nur mit Maus/Trackpad: dezente Hover-Zustände statt Druck-Animation */
@media (hover:hover) and (pointer:fine){
  .tile:hover,.exrow:hover,.ov-row:hover,.mob-row:hover{background-color:color-mix(in srgb,var(--card) 94%,var(--fg))}
  .mob-ex.active .mob-row:hover{background-color:var(--fill)}
  .row{margin:0 -8px;padding-left:8px;padding-right:8px;width:calc(100% + 16px);border-radius:12px}
  .row:hover{background-color:var(--fill-2)}
  .row:hover .r,.tile:hover .chev,.exrow:hover .chev{color:var(--fg)}
  button.u-top:hover{opacity:.78}
  .iconbtn:hover,.wnav button:hover,.sheet-top button:hover{background:var(--fill)}
  .cbt button:hover:not([aria-checked="true"]),.stp button:hover:not([disabled]),.timer .bts button:hover:not(.go){background:var(--fill)}
  .btn:hover:not([disabled]){filter:brightness(1.12)}
  .btn.ghost:hover:not([disabled]){filter:none;background:var(--fill)}
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .tick:hover:not([disabled]),.mcheck:hover{border-color:var(--c,var(--fg));color:var(--c,var(--fg))}
  .set.ok .tick:hover{color:#fff}
  .side-nav a:hover:not([aria-current="page"]){background:var(--fill)}
  .set input:hover:not([disabled]){box-shadow:inset 0 0 0 1px var(--chev)}
  button:not([disabled]):active,.tile:active,.row:active,.exrow:active,nav a:active{transform:scale(.99)}
  .day .uwrap{margin:6px -2px 8px}
}
@media (max-width:959px){.grid2,.col{display:flex;flex-direction:column;gap:12px}.wgrid{display:flex;flex-direction:column;gap:8px}
  /* Handy-Woche: jede Einheit als eigene kleine Fläche, Sprungziel unter der Statusleiste */
  .day{gap:6px;scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
  .day .row{background:var(--fill-2);border-radius:14px;padding:8px 12px 8px 10px}
  .day .uwrap{margin:2px 0}
}
.day.flash{animation:dayflash 1.2s var(--ease-out)}
@keyframes dayflash{0%,30%{box-shadow:0 0 0 2px var(--ink)}100%{box-shadow:0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
